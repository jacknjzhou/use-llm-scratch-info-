services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-extractor}
      POSTGRES_USER: ${POSTGRES_USER:-extractor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-extractor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-extractor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    # 启动前先执行数据库迁移（既有部署首次升级：alembic stamp 0001 && alembic upgrade head）
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-extractor}:${POSTGRES_PASSWORD:-extractor}@postgres:5432/${POSTGRES_DB:-extractor}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      LLM_MASTER_KEY: ${LLM_MASTER_KEY:?请在 .env 中设置 LLM_MASTER_KEY}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-5}
      LLM_MAX_RPS: ${LLM_MAX_RPS:-0}
      OCR_LANG: ${OCR_LANG:-chi_sim+eng}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-50}
      TASK_STALE_MINUTES: ${TASK_STALE_MINUTES:-30}
      API_KEY: ${API_KEY:-}
    volumes:
      - filedata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker -Q extract_high,extract -c 4 --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-extractor}:${POSTGRES_PASSWORD:-extractor}@postgres:5432/${POSTGRES_DB:-extractor}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      LLM_MASTER_KEY: ${LLM_MASTER_KEY:?请在 .env 中设置 LLM_MASTER_KEY}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-5}
      LLM_MAX_RPS: ${LLM_MAX_RPS:-0}
      OCR_LANG: ${OCR_LANG:-chi_sim+eng}
      # worker prefork 多进程，每进程连接池调小，避免多 worker 扩容打满 PG 连接
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 0
    volumes:
      - filedata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8008}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  filedata:
