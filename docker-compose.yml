services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-extractor}
      POSTGRES_USER: ${POSTGRES_USER:-extractor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-extractor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-extractor}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - doc-network

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - doc-network

  api:
    build: ./backend
    # 启动前先执行数据库迁移（既有部署首次升级：alembic stamp 0001 && alembic upgrade head）
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-extractor}:${POSTGRES_PASSWORD:-extractor}@postgres:5432/${POSTGRES_DB:-extractor}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      LLM_MASTER_KEY: ${LLM_MASTER_KEY:?请在 .env 中设置 LLM_MASTER_KEY}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-5}
      LLM_MAX_RPS: ${LLM_MAX_RPS:-0}
      OCR_LANG: ${OCR_LANG:-chi_sim+eng}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-50}
      TASK_STALE_MINUTES: ${TASK_STALE_MINUTES:-30}
      API_KEY: ${API_KEY:-}
    volumes:
      - filedata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - doc-network

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker -Q extract_high,extract -c 4 --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-extractor}:${POSTGRES_PASSWORD:-extractor}@postgres:5432/${POSTGRES_DB:-extractor}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      LLM_MASTER_KEY: ${LLM_MASTER_KEY:?请在 .env 中设置 LLM_MASTER_KEY}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-5}
      LLM_MAX_RPS: ${LLM_MAX_RPS:-0}
      OCR_LANG: ${OCR_LANG:-chi_sim+eng}
      # worker prefork 多进程，每进程连接池调小，避免多 worker 扩容打满 PG 连接
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 0
    volumes:
      - filedata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - doc-network

  frontend:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8008}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - doc-network

  # ============================================================
  # MCP Server 服务（支持 Stdio 和 SSE 两种模式）
  # ============================================================
  
  mcp-sse-internal:
    build: ./mcp-server
    container_name: doc-mcp-stdio
    restart: unless-stopped
    # Stdio 模式：供 Claude Desktop 等 MCP Client 使用
    command: --mode sse
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-extractor}:${POSTGRES_PASSWORD:-extractor}@postgres:5432/${POSTGRES_DB:-extractor}
      API_BASE_URL: http://api:8000
      STORAGE_DIR: /app/storage
      API_KEY: ${API_KEY:-}
      OCR_LANG: ${OCR_LANG:-chi_sim+eng}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-50}
    volumes:
      - filedata:/app/storage
      # 挂载本地文件目录供 MCP 访问（根据需要调整路径）
      - ${MCP_FILE_PATH:-./data}:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - doc-network
    # Stdio 模式不暴露端口，通过 docker socket 或 nfs 挂载访问

  mcp-sse:
    build: ./mcp-server
    container_name: doc-mcp-sse
    restart: unless-stopped
    # SSE 模式：供 HTTP API 调用
    command: --mode sse --host 0.0.0.0 --port 8080
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-extractor}:${POSTGRES_PASSWORD:-extractor}@postgres:5432/${POSTGRES_DB:-extractor}
      API_BASE_URL: http://api:8000
      STORAGE_DIR: /app/storage
      API_KEY: ${API_KEY:-}
      OCR_LANG: ${OCR_LANG:-chi_sim+eng}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-50}
    ports:
      - "${MCP_PORT:-8080}:8080"
    volumes:
      - filedata:/app/storage
      - ${MCP_FILE_PATH:-./data}:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - doc-network

volumes:
  pgdata:
  redisdata:
  filedata:

networks:
  doc-network:
    name: doc-extract-network
    driver: bridge
